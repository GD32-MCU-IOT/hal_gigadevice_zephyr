# GD32L235XX pin definitions
#
# Sources:
# - GD32L235xx Datasheet (Revision 2.2)
#
# AF numbers follow the alternate function tables (Table 2-12 ~ 2-16). Where
# the pin definition tables disagree, the alternate function tables are used:
# - PB2 AF5 SPI1_MISO/I2S1_MCK: not listed in the pin definition tables.
# - PD0 AF11 TIMER40_CH0: not listed in the pin definition tables.
# - PD3 AF8 UART4_TX: pin definition tables list UART4_RX.
#
# Pin codes:
#
# - 64 pins: R (GD32L235Rx - LQFP64)
# - 48 pins: C (GD32L235Cx - LQFP48)
# - 32 pins: K (GD32L235Kx - LQFP32 or QFN32)
# - 32 pins: P (GD32L235KxxxP - QFN32 with dedicated VREFP pin)
# - 25 pins: E (GD32L235Ex - WLCSP25)
#
# Memory codes:
#
# - 64Kb   Flash, 12Kb  SRAM: 8
# - 128Kb  Flash, 24Kb  SRAM: B
#
# Copyright (c) 2026, GigaDevice Semiconductor Inc.
# SPDX-License-Identifier: Apache 2.0

