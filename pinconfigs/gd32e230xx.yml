      TIMER2_CH1: 1
      TIMER15_BRKIN: 2
      I2C0_SMBA: 3
  PB6:
    pincodes: [E, G, Q, K, C]
    afs:
      USART0_TX: 0
      I2C0_SCL: 1
      TIMER15_CH0_ON: 2
  PB7:
    pincodes: [E, G, Q, K, C]
    afs:
      USART0_RX: 0
      I2C0_SDA: 1
      TIMER16_CH0_ON: 2
  PB8:
    pincodes: [Q, C]
    afs:
      I2C0_SCL: 1
      TIMER15_CH0: 2
  PB9:
    pincodes: [C]
    afs:
      IFRP_OUT: 0
      I2C0_SDA: 1
      TIMER16_CH0: 2
      EVENTOUT: 3
      I2S0_MCK: 5
      SPI1_NSS: 7
  PB10:
    pincodes: [C]
    afs:
