    afs:
      SPI0_MISO: 0
      I2S0_MCK: 0
      TIMER2_CH0: 1
      EVENTOUT: 2
      I2C0_TXFRAME: 4
      TIMER16_BRKIN: 6
  PB5:
    pincodes: [G, Q, K, C]
    afs:
      SPI0_MOSI: 0
