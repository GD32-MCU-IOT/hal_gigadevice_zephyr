      TIMER0_CH2_ON: 2
      TIMER14_CH0_ON: 3
  PF0:
    pincodes: [F, E, G, Q, K, C]
    afs:
      I2C0_SDA: 1
  PF1:
    pincodes: [F, E, G, Q, K, C]
    afs:
      I2C0_SCL: 1
  PF6:
