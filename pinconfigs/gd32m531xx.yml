# GD32M531XX pin definitions
#
# Sources:
# - GD32M531xx Datasheet Rev1.1
#   - Table 2-3. GD32M531Cx LQFP48 pin definitions
#   - Table 2-4. GD32M531Rx LQFP64 pin definitions
#   - Table 2-5 to Table 2-12. Port alternate functions summary
#
# Pin codes:
#
# - 64 pins: R (LQFP64)
# - 48 pins: C (LQFP48)
#
# Memory codes:
#
# - K8: 256KB Flash, 32KB SRAM
# - K6: 128KB Flash, 24KB SRAM
# - K4: 64KB Flash, 16KB SRAM
#
