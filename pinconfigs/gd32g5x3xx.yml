# GD32G5X3XX pin definitions
#
# Sources:
# - GD32G5X3XX Datasheet (G5x3_Device overview.md)
# - AF mapping tables 2-10 through 2-16
#
# Pin codes:
#
# - 128 pins: Q (LQFP128) - 107 GPIO
# - 100 pins: V (LQFP100) - 86 GPIO  
# - 80/81 pins: M (LQFP80/WLCSP81) - 66/67 GPIO
# - 64 pins: R (LQFP64) - 52 GPIO
# - 48 pins: C (LQFP48/QFN48) - 38/42 GPIO
#
# Memory codes:
#
# - All GD32G553xx variants: 512KB Flash (memory code E)
#
# Copyright (c) 2025, GigaDevice Semiconductor Inc.
# SPDX-License-Identifier: Apache 2.0

