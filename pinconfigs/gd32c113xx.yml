# GD32C113XX pin definitions
#
# Sources:
# - GD32C113XX Datasheet (Revision 1.5)
# - GD32C11x User Manual (Revision 1.3)
#
# Pin codes:
#
# - 100 pins: V (GD32C113Vx-LQFP100)
# - 64 pins:  R (GD32C113Rx-LQFP64)
# - 48 pins:  C (GD32C113Cx-LQFP48)
# - 36 pins:  T (GD32C113Tx-QFN36)
#
# Memory codes:
#
# - 128Kb Flash, 32Kb SRAM: B
#
