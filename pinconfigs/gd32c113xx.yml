remaps:
  # I2C0 remap (AFIO_PCF0 bit 1)
  I2C0_SCL:
    pins: [PB6, PB8]
  I2C0_SDA:
    pins: [PB7, PB9]
  # SPI0 remap (AFIO_PCF0 bit 0)
  SPI0_NSS:
    pins: [PA4, PA15]
  SPI0_SCK:
    pins: [PA5, PB3]
  SPI0_MISO:
    pins: [PA6, PB4]
  SPI0_MOSI:
    pins: [PA7, PB5]
  SPI0_IO2:
    pins: [PA2, PB6]
  SPI0_IO3:
    pins: [PA3, PB7]
  # SPI2/I2S2 remap (AFIO_PCF0 bit 28)
  SPI2_NSS:
    pins: [PA15, PA4]
  SPI2_SCK:
    pins: [PB3, PC10]
  SPI2_MISO:
    pins: [PB4, PC11]
  SPI2_MOSI:
    pins: [PB5, PC12]
  I2S2_WS:
    pins: [PA15, PA4]
  I2S2_CK:
    pins: [PB3, PC10]
  I2S2_SD:
    pins: [PB5, PC12]
  # USART0 remap (AFIO_PCF0 bit 2)
  USART0_TX:
    pins: [PA9, PB6]
  USART0_RX:
    pins: [PA10, PB7]
  # USART1 remap (AFIO_PCF0 bit 3)
  USART1_CTS:
